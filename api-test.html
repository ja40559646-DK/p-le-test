<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>SDFI Sti-Scanner</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; }
        .log-line { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .success { color: #fff; background: #27ae60; padding: 2px 5px; }
        .fail { color: #e74c3c; }
        button { background: #3498db; color: white; padding: 15px; border: none; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <h2>SDFI GATEWAY SCANNER</h2>
    <button onclick="runScan()">START SCANNING</button>
    <div id="output" style="margin-top: 20px;"></div>

<script>
    const TOKEN = "16482bf85f4018a2952adcbccccd8c84";
    const PROXY = "https://calm-truth-fd59.ja40559646.workers.dev";

    async function testPath(path) {
        const out = document.getElementById('output');
        out.innerHTML += `<div class="log-line">Tester: ${path} ...</div>`;
        
        // Vi bruger et minimalt kald for at se om stien svarer
        const url = `${PROXY}${path}?token=${TOKEN}&SERVICE=WFS&VERSION=1.1.0&REQUEST=GetCapabilities`;
        
        try {
            const resp = await fetch(url);
            if (resp.status === 200) {
                out.innerHTML += `<div class="log-line success">VINDING! Stien '${path}' virker!</div>`;
                return true;
            } else {
                out.innerHTML += `<div class="log-line fail">Fejl ${resp.status} på ${path}</div>`;
            }
        } catch (e) {
            out.innerHTML += `<div class="log-line fail">Netværksfejl</div>`;
        }
        return false;
    }

    async function runScan() {
        document.getElementById('output').innerHTML = "Starter scan...<br>";
        
        // De her 4 er de mest brugte gateways i det nye system
        const paths = [
            "/geus_jupiter_wfs",
            "/jupiter",
            "/geus_jupiter",
            "/wfs/geus_jupiter"
        ];

        for (let p of paths) {
            const found = await testPath(p);
            if (found) {
                out.innerHTML += `<h3><br>Brug denne sti i din kode: ${p}</h3>`;
                break;
            }
        }
    }
</script>
</body>
</html>
