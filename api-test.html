<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>SDFI via Proxy Test | SUCCESS</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #1a1a1a; color: #eee; }
        .container { max-width: 700px; margin: 0 auto; background: #2d2d2d; padding: 25px; border-radius: 12px; border-top: 4px solid #27ae60; }
        #console { 
            background: #000; border: 1px solid #444; padding: 15px; border-radius: 6px; 
            height: 300px; overflow-y: auto; font-family: monospace; color: #00ff00; margin: 20px 0;
        }
        .btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1rem; }
        .btn:hover { background: #219150; }
    </style>
</head>
<body>

<div class="container">
    <h2>SDFI via Cloudflare Proxy</h2>
    <p>Proxy-URL: <code style="color: #3498db;">https://calm-truth-fd59.ja40559646.workers.dev/</code></p>
    
    <button class="btn" onclick="startTest()">KØR FORBINDELSES-TEST</button>
    
    <div id="console">Tryk på knappen for at teste din nye bro...</div>
</div>

<script>
    const MY_TOKEN = "16482bf85f4018a2952adcbccccd8c84";
    const PROXY_URL = "https://calm-truth-fd59.ja40559646.workers.dev"; 

    const consoleEl = document.getElementById('console');

    function log(msg, color = "#00ff00") {
        consoleEl.innerHTML += `<div>[${new Date().toLocaleTimeString()}] <span style="color: ${color}">${msg}</span></div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function startTest() {
        consoleEl.innerHTML = '';
        log("Kontakter din Cloudflare Worker...");

        // Vi bygger URL'en til Jupiter WFS via din proxy
        const targetPath = "/geus_jupiter_wfs";
        const params = `?token=${MY_TOKEN}&service=WFS&version=1.1.0&request=GetFeature&typeName=geus_jupiter_wfs:boring&outputFormat=json&maxFeatures=5&BBOX=12.5,55.6,12.6,55.7,EPSG:4326`;
        
        const finalUrl = PROXY_URL + targetPath + params;

        try {
            const response = await fetch(finalUrl);
            log("Worker svarede. HTTP Status: " + response.status);

            if (!response.ok) {
                const errText = await response.text();
                log("SDFI afviste kaldet gennem proxyen: " + errText, "#e74c3c");
                return;
            }

            const data = await response.json();
            if (data.features) {
                log("FEJRING! Vi er igennem muren.", "#2ecc71");
                log("Data modtaget: " + data.features.length + " boringer fundet i test-området.");
                log("Første DGU-nr: " + data.features[0].properties.dgunr);
            }
        } catch (err) {
            log("FEJL: Kunne ikke forbinde til din Worker. Tjek om den er 'Deployed'.", "#e74c3c");
            log(err.message, "#e74c3c");
        }
    }
</script>

</body>
</html>
