<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>SDFI Token Final Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eee; }
        #log { background: #000; color: #0f0; padding: 20px; font-family: monospace; white-space: pre-wrap; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>SDFI Simpel Token Validering</h2>
    <button onclick="testToken()" style="padding: 15px; background: #2980b9; color: white; border: none; cursor: pointer;">TEST TOKEN NU</button>
    <div id="log">Venter...</div>

<script>
    const TOKEN = "16482bf85f4018a2952adcbccccd8c84";
    const logEl = document.getElementById('log');

    async function testToken() {
        logEl.innerText = "Tester token...\n";
        
        // Vi tester en simpel koordinat-søgning (omkring Aarhus)
        // Dette endpoint kræver typisk token og er meget stabilt.
        const targetUrl = `https://api.dataforsyningen.dk/vejstykker?token=${TOKEN}&x=10.21&y=56.15`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        try {
            const resp = await fetch(proxyUrl);
            const text = await resp.text();
            
            logEl.innerText += "Status fra SDFI: " + resp.status + "\n";
            logEl.innerText += "Svar: " + text.substring(0, 500);
            
            if (resp.status === 401) {
                logEl.innerText += "\n\nDOM: Din TOKEN er ugyldig eller ikke aktiv.";
            } else if (resp.status === 200) {
                logEl.innerText += "\n\nDOM: DIN TOKEN VIRKER! Fejlen ligger i WFS-opsætningen.";
            }
        } catch (err) {
            logEl.innerText += "FEJL: " + err.message;
        }
    }
</script>
</body>
</html>
