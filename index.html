<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borings-Atlas 2026 | SDFI Fix</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #1a252f; --accent: #3498db; --success: #27ae60; }
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        #sidebar { width: 380px; padding: 20px; background: white; border-right: 1px solid #ddd; z-index: 1000; overflow-y: auto; display: flex; flex-direction: column; }
        #map { flex-grow: 1; }
        .card { background: #fff; border: 1px solid #edeff2; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.3rem; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4b4b4b; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #edeff2; border-radius: 8px; box-sizing: border-box; }
        .suggestions-list { background: white; border: 1px solid #ddd; position: absolute; width: calc(100% - 30px); z-index: 2000; max-height: 200px; overflow-y: auto; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .suggestion-item:hover { background: #f8f9fa; }
        .stats-box { text-align: center; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; }
        .ready { background: #dcfce7; color: #166534; }
        .searching { background: #dbeafe; color: #1e40af; }
        .error { background: #fee2e2; color: #991b1b; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { background: #cbd5e0; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Borings-lokalisering</h2>
    <div class="card">
        <label>Søg adresse</label>
        <div style="position: relative;">
            <input type="text" id="addressInput" placeholder="Vej og husnummer..." autocomplete="off">
            <div id="suggestions" class="suggestions-list"></div>
        </div>
    </div>
    <div class="card">
        <label>Søgeradius: <span id="radiusText">1000</span> m</label>
        <input type="range" id="radiusSlider" min="100" max="2000" step="100" value="1000" style="width: 100%;">
    </div>
    <div id="statusBox" class="stats-box">Klar</div>
    <div style="margin-top: auto;">
        <button id="nextStepBtn" class="btn-main" disabled>LOG PUNKT & SE DETALJER</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // DIN TOKEN
    const TOKEN = "16482bf85f4018a2952adcbccccd8c84"; 

    let map, projectPin, searchCircle, boreholeLayer;
    let currentData = { lat: null, lng: null, radius: 1000 };

    map = L.map('map', { zoomControl: false }).setView([56.1, 10.6], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    boreholeLayer = L.layerGroup().addTo(map);

    const addrInput = document.getElementById('addressInput');
    const suggestionsEl = document.getElementById('suggestions');
    const statusBox = document.getElementById('statusBox');

    // DAWA Autocomplete (Dette endpoint har CORS tilladelse)
    addrInput.addEventListener('input', async (e) => {
        const q = e.target.value;
        if (q.length < 3) { suggestionsEl.innerHTML = ''; return; }
        const resp = await fetch(`https://api.dataforsyningen.dk/adresser/autocomplete?q=${encodeURIComponent(q)}`);
        const data = await resp.json();
        suggestionsEl.innerHTML = '';
        data.forEach(item => {
            const d = document.createElement('div');
            d.className = 'suggestion-item';
            d.innerText = item.tekst;
            d.onclick = () => selectAddress(item);
            suggestionsEl.appendChild(d);
        });
    });

    async function selectAddress(item) {
        addrInput.value = item.tekst;
        suggestionsEl.innerHTML = '';
        const resp = await fetch(item.adresse.href);
        const data = await resp.json();
        const lat = data.adgangsadresse.adgangspunkt.koordinater[1];
        const lng = data.adgangsadresse.adgangspunkt.koordinater[0];
        initProject(lat, lng);
    }

    function initProject(lat, lng) {
        currentData.lat = lat;
        currentData.lng = lng;
        if (projectPin) map.removeLayer(projectPin);
        if (searchCircle) map.removeLayer(searchCircle);

        projectPin = L.marker([lat, lng], { draggable: true }).addTo(map);
        searchCircle = L.circle([lat, lng], { radius: currentData.radius, color: '#3498db', fillOpacity: 0.1 }).addTo(map);
        map.setView([lat, lng], 15);

        projectPin.on('dragend', (e) => {
            const pos = e.target.getLatLng();
            currentData.lat = pos.lat; currentData.lng = pos.lng;
            searchCircle.setLatLng(pos);
            fetchBoreholes();
        });
        fetchBoreholes();
    }

    // --- NY METODE: SDFI OGC API FEATURES ---
    async function fetchBoreholes() {
        if (!currentData.lat) return;
        boreholeLayer.clearLayers();
        statusBox.className = "stats-box searching";
        statusBox.innerText = "Henter boringer...";

        const bbox = getBBox(currentData.lat, currentData.lng, currentData.radius);
        
        // Vi skifter til SDFI's OGC API Features, som er designet til web (CORS-friendly)
        // Her bruger vi BBOX i formatet: minLng,minLat,maxLng,maxLat
        const bboxStr = `${bbox.minLng},${bbox.minLat},${bbox.maxLng},${bbox.maxLat}`;
        const url = `https://api.dataforsyningen.dk/geus_jupiter_v1/items?token=${TOKEN}&limit=500&bbox=${bboxStr}`;

        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error("Fejl: " + resp.status);
            const data = await resp.json();
            
            // OGC API returnerer 'features' array
            const count = data.features ? data.features.length : 0;

            statusBox.className = "stats-box ready";
            statusBox.innerText = `Fundet: ${count} boringer`;
            document.getElementById('nextStepBtn').disabled = (count === 0);

            data.features.forEach(f => {
                const coords = f.geometry.coordinates; // [lng, lat]
                L.circleMarker([coords[1], coords[0]], {
                    radius: 5, color: '#2c3e50', fillColor: '#34495e', fillOpacity: 0.8, weight: 1
                }).bindTooltip(`DGU: ${f.properties.dgunr || 'Ukendt'}`).addTo(boreholeLayer);
            });
        } catch (e) {
            statusBox.className = "stats-box error";
            statusBox.innerText = "SDFI blokerer stadig (CORS).";
            console.error("Fetch fejl:", e);
        }
    }

    document.getElementById('radiusSlider').oninput = (e) => {
        currentData.radius = parseInt(e.target.value);
        document.getElementById('radiusText').innerText = currentData.radius;
        if (searchCircle) searchCircle.setRadius(currentData.radius);
    };
    document.getElementById('radiusSlider').onchange = fetchBoreholes;

    function getBBox(lat, lng, radius) {
        const d = radius / 111320;
        return { 
            minLat: lat - d, maxLat: lat + d, 
            minLng: lng - (d / Math.cos(lat * Math.PI / 180)), 
            maxLng: lng + (d / Math.cos(lat * Math.PI / 180)) 
        };
    }
</script>
</body>
</html>
