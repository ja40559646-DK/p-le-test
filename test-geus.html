<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>GEUS Test: CORB FIX</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; max-width: 800px; margin: auto; }
        #log { background: #222; color: #0f0; padding: 10px; border-radius: 4px; max-height: 300px; overflow: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2>Jupiter WFS Test (CORB FIX)</h2>
    <p>Vi forsøger med et andet format-kald for at omgå browserens blokering.</p>
    
    <button id="btnHent">Hent Data for 222. 95</button>
    <p id="status">Status: Venter...</p>

    <div id="resultArea">
        <pre id="log">Logbeskeder vises her...</pre>
    </div>
</div>

<script>
    const TOKEN = "16482bf85f4018a2952adcbccccd8c84";
    const DGU = "222. 95";

    // Denne funktion SKAL være global (window.)
    window.handleJupiterData = function(data) {
        console.log("Data modtaget!", data);
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        status.innerText = "Succes! Data modtaget.";
        log.innerText = JSON.stringify(data, null, 2);
    };

    document.getElementById('btnHent').addEventListener('click', function() {
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        
        status.innerText = "Sender anmodning...";
        log.innerText = "Prøver at hente via JSONP...";

        // ÆNDRING: Vi bruger OUTPUTFORMAT=text/javascript (hvis understøttet) 
        // eller fjerner JSON-tvangen og lader callback styre det.
        // Vi prøver også at fjerne mellemrummet i CQL filteret for en sikkerheds skyld
        const dguClean = DGU.replace(" ", "%20");
        const url = `https://api.dataforsyningen.dk/geus_jupiter_wfs?token=${TOKEN}&SERVICE=WFS&VERSION=1.1.0&REQUEST=GetFeature&TYPENAME=geus_jupiter_wfs:jordlag&OUTPUTFORMAT=text/javascript&format_options=callback:handleJupiterData&CQL_FILTER=dgunr='${DGU}'`;

        const script = document.createElement('script');
        script.src = url;
        
        script.onerror = function() {
            // Hvis det fejler, er det sandsynligvis fordi WFS-tjenesten ikke vil levere JSONP
            status.innerText = "Fejl: Browseren blokerede kaldet (CORS/CORB).";
            log.innerText += "\n\nFEJL: WFS-tjenesten tillader muligvis ikke direkte JSONP-kald fra GitHub Pages.";
        };

        document.body.appendChild(script);
    });
</script>

</body>
</html>
