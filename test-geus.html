<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hul Igennem Test</title>
</head>
<body>
    <button onclick="checkJupiter()">TEST FORBINDELSE TIL JUPITER</button>
    <pre id="resultat">Venter på klik...</pre>

    <script>
        // Vi bruger den funktion, som din browser skal kalde, når data kommer retur
        window.modtagData = function(data) {
            console.log("Data modtaget!", data);
            document.getElementById('resultat').innerText = "HUL IGENNEM! Her er rådata:\n\n" + JSON.stringify(data, null, 2);
        };

        function checkJupiter() {
            const token = "16482bf85f4018a2952adcbccccd8c84";
            const output = document.getElementById('resultat');
            output.innerText = "Prøver at hente data...";

            // Vi bygger URL'en præcis som din adressesøger, men peger på Jupiter boringer
            const url = "https://api.dataforsyningen.dk/geus_jupiter_wfs" +
                        "?token=" + token +
                        "&SERVICE=WFS" +
                        "&VERSION=1.1.0" +
                        "&REQUEST=GetFeature" +
                        "&TYPENAME=geus_jupiter_wfs:boring" +
                        "&MAXFEATURES=1" + 
                        "&OUTPUTFORMAT=json" +
                        "&format_options=callback:modtagData"; // Dette fortæller serveren at bruge JSONP

            const script = document.createElement('script');
            script.src = url;
            script.onerror = function() {
                output.innerText = "FEJL: Kunne ikke indlæse data. Tjek om din token er aktiv til Jupiter-data.";
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
