<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>GEUS Test: 222. 95</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); max-width: 800px; margin: auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; }
        .waiting { background: #e3f2fd; color: #0d47a1; }
        .success { background: #e8f5e9; color: #1b5e20; }
        .error { background: #ffebee; color: #b71c1c; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #eee; }
        pre { background: #222; color: #0f0; padding: 10px; border-radius: 4px; max-height: 200px; overflow: auto; font-size: 11px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Jupiter WFS Test (Boring 222. 95)</h2>
    <p>Vi forsøger at hente jordlag fra GEUS' database.</p>
    
    <button id="btnHent" style="padding: 10px 20px; cursor: pointer;">Hent Data Nu</button>

    <div id="statusBox"></div>

    <div id="resultArea" style="display:none;">
        <h3>Jordlag fundet:</h3>
        <table id="jordlagTabel">
            <thead>
                <tr>
                    <th>Fra (m)</th>
                    <th>Til (m)</th>
                    <th>Beskrivelse</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h4>Rå Log:</h4>
    <pre id="log">Venter på klik...</pre>
</div>

<script>
    // Konstanter
    const TOKEN = "16482bf85f4018a2952adcbccccd8c84";
    const DGU = "222. 95";

    // Vi bruger en EventListener i stedet for onclick i HTML, 
    // da det er mere sikkert og undgår "not defined" fejl.
    document.getElementById('btnHent').addEventListener('click', async function() {
        const statusBox = document.getElementById('statusBox');
        const log = document.getElementById('log');
        const tbody = document.querySelector('#jordlagTabel tbody');
        const resultArea = document.getElementById('resultArea');

        statusBox.className = "status waiting";
        statusBox.innerText = "Forbinder til GEUS...";
        log.innerText = "Starter fetch...";

        // Den præcise URL til jordlag via WFS
        const url = `https://api.dataforsyningen.dk/geus_jupiter_wfs?token=${TOKEN}&SERVICE=WFS&VERSION=1.1.0&REQUEST=GetFeature&TYPENAME=geus_jupiter_wfs:jordlag&OUTPUTFORMAT=json&CQL_FILTER=dgunr='${encodeURIComponent(DGU)}'`;

        try {
            const response = await fetch(url);
            
            if (!response.ok) throw new Error("Netværksfejl: " + response.status);

            const data = await response.json();
            log.innerText = JSON.stringify(data, null, 2);

            if (data.features && data.features.length > 0) {
                statusBox.className = "status success";
                statusBox.innerText = "Succes! Data modtaget.";
                
                // Tøm tabellen og fyld den
                tbody.innerHTML = "";
                data.features.sort((a,b) => a.properties.topdybde - b.properties.topdybde).forEach(f => {
                    const p = f.properties;
                    tbody.innerHTML += `<tr>
                        <td>${p.topdybde}</td>
                        <td>${p.bunddybde}</td>
                        <td>${p.bjergart || 'Ukendt'}</td>
                    </tr>`;
                });
                resultArea.style.display = "block";
            } else {
                statusBox.className = "status error";
                statusBox.innerText = "Ingen data fundet for DGU 222. 95.";
            }

        } catch (err) {
            statusBox.className = "status error";
            statusBox.innerText = "Fejl: " + err.message;
            log.innerText = "FEJL: " + err.stack;
        }
    });
</script>

</body>
</html>
